[package]
name = "aleo-explorer-rust"
version = "0.14.0"
edition = "2021"

[dependencies]

pyo3 = { version = "0.23.5", features = ["extension-module", "num-bigint"] }

num-bigint = "0.4.6"

snarkvm-algorithms = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-circuit-network = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-curves = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-console-account = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-console-network = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-console-program = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-synthesizer-program = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-utilities = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-ledger-puzzle = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-ledger-puzzle-epoch = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }
snarkvm-ledger-block = { git = "https://github.com/AleoNet/snarkVM", rev = "c72e4ddf" }


#leo-compiler = { git = "https://github.com/AleoHQ/leo", rev = "ac3f667e19e15e84d704efa2ae5b948318361e00" }
#leo-errors = { git = "https://github.com/AleoHQ/leo", rev = "ac3f667e19e15e84d704efa2ae5b948318361e00" }
#leo-span = { git = "https://github.com/AleoHQ/leo", rev = "ac3f667e19e15e84d704efa2ae5b948318361e00" }

#leo-compiler = { git = "https://github.com/AleoHQ/leo", branch = "mainnet" }
#leo-errors = { git = "https://github.com/AleoHQ/leo", branch = "mainnet" }
#leo-span = { git = "https://github.com/AleoHQ/leo", branch = "mainnet" }
#leo-disassembler = { git = "https://github.com/AleoHQ/leo", branch = "mainnet" }
#leo-ast = { git = "https://github.com/AleoHQ/leo", branch = "mainnet" }

anyhow = "1.0.86"
rand = "0.8.5"
rand_chacha = "0.3.1"
bech32 = "0.11.0"
tempfile = "3.23.0"
indexmap = "2.0"

[build-dependencies]
pyo3-build-config = "0.23.5"

[lib]
crate-type = ["cdylib"]
name = "aleo_explorer_rust"

[profile.dev]
opt-level = 1
debug-assertions = false
